<svg xmlns="http://www.w3.org/2000/svg" width="854" height="130" viewBox="0 0 854 130" role="img" aria-labelledby="title description">
  <title id="title">Animated profile footer</title>
  <desc id="description">A flowing aurora where deep blue and amber blend into each other.</desc>
  <style>
    .sign { font: 600 12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; letter-spacing: 3px; }
  </style>
  <defs>
    <filter id="blur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
    <clipPath id="shape">
      <path d="M0 130H854V40C720 12 580 58 427 34C274 10 140 52 0 26Z">
        <animate attributeName="d" dur="18s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.5;1" keySplines=".45 0 .55 1;.45 0 .55 1"
          values="M0 130H854V40C720 12 580 58 427 34C274 10 140 52 0 26Z;M0 130H854V24C710 52 590 12 427 38C264 64 150 16 0 42Z;M0 130H854V40C720 12 580 58 427 34C274 10 140 52 0 26Z"/>
      </path>
    </clipPath>
  </defs>

  <g clip-path="url(#shape)">
    <rect width="854" height="130" fill="#071A33"/>
    <g filter="url(#blur)">
      <circle cx="740" cy="90" r="130" fill="#1E5FD0" opacity=".95">
        <animateTransform attributeName="transform" type="translate" dur="19s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.5;1" keySplines=".45 0 .55 1;.45 0 .55 1" values="0 0;-90 -20;0 0"/>
      </circle>
      <circle cx="430" cy="120" r="120" fill="#7A4FB0" opacity=".55">
        <animateTransform attributeName="transform" type="translate" dur="17s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.5;1" keySplines=".45 0 .55 1;.45 0 .55 1" values="0 0;120 -20;0 0"/>
      </circle>
      <circle cx="110" cy="80" r="130" fill="#FF7900" opacity=".85">
        <animateTransform attributeName="transform" type="translate" dur="21s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.5;1" keySplines=".45 0 .55 1;.45 0 .55 1" values="0 0;110 -15;0 0"/>
      </circle>
      <circle cx="560" cy="40" r="110" fill="#2F86F5" opacity=".6">
        <animateTransform attributeName="transform" type="translate" dur="23s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.5;1" keySplines=".45 0 .55 1;.45 0 .55 1" values="0 0;-150 25;0 0"/>
      </circle>
      <circle cx="260" cy="20" r="90" fill="#FFB45D" opacity=".45">
        <animateTransform attributeName="transform" type="translate" dur="15s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.5;1" keySplines=".45 0 .55 1;.45 0 .55 1" values="0 0;80 30;0 0"/>
      </circle>
    </g>
  </g>

  <text x="427" y="96" text-anchor="middle" fill="#E4F0FF" fill-opacity=".75" class="sign">THANKS FOR STOPPING BY</text>
</svg>
