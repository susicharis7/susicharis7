<svg xmlns="http://www.w3.org/2000/svg" width="760" height="260" viewBox="0 0 760 260" role="img" aria-labelledby="title desc">
  <title id="title">Haris Susic technology orbit</title>
  <desc id="desc">Technologies orbit slowly around the HS monogram.</desc>

  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.52" stop-color="#17122c"/>
      <stop offset="1" stop-color="#0b1020"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#00d4ff"/>
      <stop offset="0.5" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#ff4d6d"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="1" y="1" width="758" height="258" rx="18" fill="url(#panel)" stroke="#2b3350"/>
  <ellipse cx="380" cy="130" rx="270" ry="88" fill="none" stroke="#7c3aed" stroke-opacity="0.22"/>
  <ellipse cx="380" cy="130" rx="210" ry="66" fill="none" stroke="#00d4ff" stroke-opacity="0.12" stroke-dasharray="5 9"/>

  <circle cx="380" cy="130" r="41" fill="#0b1020" stroke="url(#core)" stroke-width="3" filter="url(#glow)"/>
  <text x="380" y="137" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="22" font-weight="700">HS</text>
  <circle cx="380" cy="130" r="51" fill="none" stroke="#00d4ff" stroke-opacity="0.25">
    <animate attributeName="r" values="47;55;47" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="stroke-opacity" values="0.4;0.05;0.4" dur="3s" repeatCount="indefinite"/>
  </circle>

  <g font-family="Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">
    <g>
      <rect x="-31" y="-14" width="62" height="28" rx="7" fill="#131b31" stroke="#61dafb"/>
      <text y="4" fill="#61dafb">React</text>
      <animateMotion path="M380 42 A270 88 0 1 1 379.9 42" dur="22s" repeatCount="indefinite" rotate="0"/>
    </g>
    <g>
      <rect x="-34" y="-14" width="68" height="28" rx="7" fill="#131b31" stroke="#f7df1e"/>
      <text y="4" fill="#f7df1e">Node.js</text>
      <animateMotion path="M380 42 A270 88 0 1 1 379.9 42" dur="22s" begin="-2.75s" repeatCount="indefinite" rotate="0"/>
    </g>
    <g>
      <rect x="-34" y="-14" width="68" height="28" rx="7" fill="#131b31" stroke="#3776ab"/>
      <text y="4" fill="#f4d35e">Python</text>
      <animateMotion path="M380 42 A270 88 0 1 1 379.9 42" dur="22s" begin="-5.5s" repeatCount="indefinite" rotate="0"/>
    </g>
    <g>
      <rect x="-35" y="-14" width="70" height="28" rx="7" fill="#131b31" stroke="#00d4ff"/>
      <text y="4" fill="#00d4ff">FastAPI</text>
      <animateMotion path="M380 42 A270 88 0 1 1 379.9 42" dur="22s" begin="-8.25s" repeatCount="indefinite" rotate="0"/>
    </g>
    <g>
      <rect x="-39" y="-14" width="78" height="28" rx="7" fill="#131b31" stroke="#47a248"/>
      <text y="4" fill="#55c875">MongoDB</text>
      <animateMotion path="M380 42 A270 88 0 1 1 379.9 42" dur="22s" begin="-11s" repeatCount="indefinite" rotate="0"/>
    </g>
    <g>
      <rect x="-28" y="-14" width="56" height="28" rx="7" fill="#131b31" stroke="#ff9900"/>
      <text y="4" fill="#ffb13b">AWS</text>
      <animateMotion path="M380 42 A270 88 0 1 1 379.9 42" dur="22s" begin="-13.75s" repeatCount="indefinite" rotate="0"/>
    </g>
    <g>
      <rect x="-43" y="-14" width="86" height="28" rx="7" fill="#131b31" stroke="#3178c6"/>
      <text y="4" fill="#67a9e8">TypeScript</text>
      <animateMotion path="M380 42 A270 88 0 1 1 379.9 42" dur="22s" begin="-16.5s" repeatCount="indefinite" rotate="0"/>
    </g>
    <g>
      <rect x="-43" y="-14" width="86" height="28" rx="7" fill="#131b31" stroke="#336791"/>
      <text y="4" fill="#73b5e6">PostgreSQL</text>
      <animateMotion path="M380 42 A270 88 0 1 1 379.9 42" dur="22s" begin="-19.25s" repeatCount="indefinite" rotate="0"/>
    </g>
  </g>
</svg>
