name: Generate contribution snake

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate blue-purple contribution snakes
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#2563EB&color_dots=#EBEDF0,#BFDBFE,#60A5FA,#6366F1,#7C3AED
            dist/github-contribution-grid-snake-dark.svg?color_snake=#00D4FF&color_dots=#0B1020,#172554,#1D4ED8,#4F46E5,#7C3AED

      - name: Publish snake assets
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
